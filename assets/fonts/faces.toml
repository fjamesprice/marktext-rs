# The pinned face list — the artifact M3 §8 D7 says S1 owes.
#
# D7 decided that `mt-layout` never enumerates or opens a font: a collection is
# built **above** it and passed in, and goldens run against a pinned bundled set
# registered from bytes. That makes this directory a committed artifact of the
# repository rather than a property of the developer's machine, which is what
# D10's exact-equality layout goldens need in order to mean anything.
#
# **THE ORDER OF `[[face]]` ENTRIES IS LOAD-BEARING.** It is the fallback chain,
# in the order a shell must register and offer the faces, and it is therefore
# baked into every golden. Reordering these entries is a golden-changing event
# on the same footing as moving the parley pin (D2) — review it as one.
#
# Each entry carries the same keys, so a loader needs no per-file special
# casing:
#
#   file      name in this directory
#   family    the family name **skrifa reports**, not the one we would like.
#             `cargo run -p s1-faces --release` re-reads every file and fails
#             loudly if this string disagrees with the font's own name table.
#   subfamily the style name in the font's own name table (ID 2). Recorded
#             because it is not always "Regular" — DejaVu Sans Mono says "Book".
#   weight    CSS weight the shell should register/request this face as
#   style     "normal" | "italic" | "oblique"
#   variable  true if the file has an `fvar` table
#   axes      variation axes; empty for every static face. A variable face's
#             default instance is what parley resolves when nothing asks
#             otherwise, and that instance is what a golden bakes in.
#   scripts   ISO 15924 codes this face is in the list to cover. **Measured**
#             from the font's own cmap (see README.md's per-block table), not
#             claimed from the family name.
#   fallback_scripts
#             the ISO 15924 keys a shell should register this face under with
#             `Collection::append_fallbacks`. A **second** field rather than a
#             reuse of `scripts`, because they answer different questions:
#             `scripts` is what the face covers, this is what fontique should
#             be told to reach for. They coincide today except that the
#             DejaVu obliques claim `Zyyy` without claiming `Arab`.
#   generic_families
#             CSS generic names to register this face under with
#             `Collection::append_generic_families`. This field exists because
#             of a measurement, not a preference: **parley resolves emoji
#             through the generic family, not through script fallback.**
#             `parley/src/shape/mod.rs:329` appends
#             `QueryFamily::Generic(GenericFamily::Emoji)` to the query for any
#             cluster where `CharCluster::is_emoji()`, so a Noto Emoji
#             registered only as a `Zsye` script fallback is never consulted —
#             67 of `emoji.md`'s 82 codepoints stayed tofu until this field
#             drove `append_generic_families(Emoji, …)`. The `sans-serif` and
#             `monospace` entries are the other half: both theme stacks end in
#             a CSS generic, and with `system_fonts: false` nothing else
#             defines what those generics mean.
#   derived   true if this file was **generated from** an upstream font rather
#             than committed as upstream shipped it. Exactly one entry is
#             `true` today (the CJK subset). The key is on every entry, not
#             just that one, so a loader special-cases nothing.
#   derived_from
#             the upstream file, its version and its SHA-256. Empty when
#             `derived = false`.
#   derived_command
#             the exact command that regenerates the file from
#             `derived_from`. Empty when `derived = false`. This is the whole
#             reason a derived artifact is acceptable at all: it is
#             re-derivable, byte for byte, by anyone.
#   role      "body" | "code" | "fallback" — which theme stack names this
#             family (crates/mt-layout/themes/muya-default.toml `[fonts]`), or
#             "fallback" if no stack names it and it exists only to catch
#             codepoints the named families lack.
#   bytes     file size, so a truncated checkout is caught before the hash is
#   sha256    of the file as committed. Determinism, per D10.
#
# One entry is a **corpus-derived subset and a test fixture, not a shipped
# asset** — see the CJK section below and README.md §6. Nothing else here is
# derived; `derived = false` on the other eleven says so mechanically.

[meta]
# Bumped when the *set* changes (a face added, removed or reordered), not when
# this comment is edited. A golden header can cite it.
revision = 1
# The parley revision these faces were measured against — D2's pin. A face list
# is only reproducible together with the shaper that reads it.
parley_rev = "a0752c7bdc3ad88dac19fc194d2b8e57e59bea2e"
total_font_bytes = 4388460

# ---------------------------------------------------------------------------
# 1. Open Sans — the body stack's first named family
# ---------------------------------------------------------------------------
# `[fonts] body` in muya-default.toml names "Open Sans" first, and D7 records
# that MarkText's own copy is unusable: eight `.woff` files that skrifa rejects
# silently. This is the same family re-sourced upstream as static `.ttf`, which
# is what "M3 must re-source Open Sans" meant.
#
# Re-sourcing upstream also **discharged the Hebrew half of M3-R10 for free**:
# MarkText shipped the `latin-ext_latin` web subset, and upstream v3.003 carries
# 45 codepoints of U+0590–05FF. `rtl.md`'s Hebrew is covered by this face, not
# by anything added for it. See README.md.

[[face]]
file = "OpenSans-Regular.ttf"
family = "Open Sans"
subfamily = "Regular"
weight = 400
style = "normal"
variable = false
axes = []
scripts = ["Latn", "Grek", "Cyrl", "Hebr"]
fallback_scripts = ["Latn", "Grek", "Cyrl", "Hebr"]
generic_families = ["sans-serif"]
role = "body"
derived = false
derived_from = ""
derived_command = ""
bytes = 147528
sha256 = "c53aceea2dcf5b4098099c0c4d0a061d17e178a049317b42a422b1a9f7f8eb59"

