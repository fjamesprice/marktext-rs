# ---------------------------------------------------------------------------
# 3. Noto Emoji — monochrome, and the only variable face in the set
# ---------------------------------------------------------------------------
# Monochrome rather than colour on purpose. S1 needs correct advances and
# cluster counts; **whether the face carries colour is S4's problem** (COLR vs
# CBDT is a `mt-render` question). The price difference is the argument:
# NotoEmoji is 1,982,596 B, NotoColorEmoji.ttf (CBDT) is 10,673,480 B and
# Noto-COLRv1.ttf is 4,991,984 B. Swapping this entry for one of those later
# changes advances and therefore every emoji golden — a reviewable event.
#
# **This is the one variable font in the set and there is no static instance to
# prefer.** google/fonts ships `NotoEmoji[wght].ttf` only; there is no
# `static/` directory in `ofl/notoemoji`, and googlefonts/noto-emoji publishes
# only the colour builds. So the golden bakes in whatever instance parley
# resolves: for text at weight 400 that is the `fvar` default (wght = 400,
# i.e. no deltas applied); a bold heading resolves wght = 700 and gets
# different advances. Both are deterministic, and both come out of this file.
#
# The brackets in the file name are upstream's, not ours. Nothing globs for it
# — loaders read `file` from this list.

[[face]]
file = "NotoEmoji[wght].ttf"
family = "Noto Emoji"
subfamily = "Regular"
weight = 400
style = "normal"
variable = true
axes = [{ tag = "wght", min = 300.0, default = 400.0, max = 700.0 }]
scripts = ["Zsye"]
fallback_scripts = ["Zsye"]
generic_families = ["emoji"]
role = "fallback"
derived = false
derived_from = ""
derived_command = ""
bytes = 1982596
sha256 = "de6c18832938afc99caf132b39d6a30a19bac7f2e812e28db2535b4608d27551"

# ---------------------------------------------------------------------------
# 4. Noto Sans CJK SC — a CORPUS-DERIVED SUBSET, and a TEST FIXTURE
# ---------------------------------------------------------------------------
# **This file is not a shipped asset and must never become one.** D7 splits the
# two roles: *"goldens run against a pinned bundled set registered from bytes;
# the shipped previewer adds system fonts on top."* The bundled set's job is
# **golden reproducibility**, not user-facing coverage — a real user's CJK
# comes from their system fonts at S5 either way. So the fixture only has to
# render the corpus, and 56,268 B does that as well as 16,437,364 B would.
#
# `derived = true` is the flag that says so, and it is the reason the three
# `derived_*` keys exist on **every** entry rather than only this one: a loader
# must not need to special-case the odd one out.
#
# **This face stops covering the corpus the moment the corpus changes.** That
# is the price of the 292× saving and it is a written contract, not an
# oversight — see `README.md` §6 for the regeneration command and for the check
# `cargo xtask layout` owes to make the failure loud instead of silent.
#
# Placed after Noto Emoji and before DejaVu Sans Mono: it must not intercept
# emoji (which route through `GenericFamily::Emoji` in any case), and DejaVu
# stays last as the widest, least appropriate net.
#
# No Reserved Font Name is declared anywhere — not in the upstream OFL
# (`LICENSE-NotoSansCJK.txt` mentions the phrase only in the licence's own
# definitions) and not in the font's `name` table (ID 0 is
# "© 2014-2021 Adobe (http://www.adobe.com/)", with no RFN clause). So the
# family name is kept, which matters mechanically: the chain resolves on it.
# ID 7 carries a trademark notice, "Noto is a trademark of Google Inc." — that
# is trademark law rather than the OFL, and this fixture neither ships nor
# promotes anything, so it does not bar keeping the name. Recorded so the
# judgement is auditable rather than assumed.

[[face]]
file = "NotoSansCJKsc-Regular-corpus-subset.otf"
family = "Noto Sans CJK SC"
subfamily = "Regular"
weight = 400
style = "normal"
variable = false
axes = []
scripts = ["Hani", "Hira", "Kana", "Hang", "Zyyy"]
fallback_scripts = ["Hani", "Hira", "Kana", "Hang"]
generic_families = []
role = "fallback"
derived = true
derived_from = "NotoSansCJKsc-Regular.otf 2.004, sha256 2c76254f6fc379fddfce0a7e84fb5385bb135d3e399294f6eeb6680d0365b74b"
derived_command = "python -m fontTools.subset NotoSansCJKsc-Regular.otf --unicodes-file=corpus-nonascii.txt --layout-features='*' --output-file=NotoSansCJKsc-Regular-corpus-subset.otf"
bytes = 56268
sha256 = "05cc026ccff2e5c4954fed438be311a0fe3747caf0826a7117c649a252c0137d"

# ---------------------------------------------------------------------------
# 5. DejaVu Sans Mono — the code stack, and the last-resort symbol face
# ---------------------------------------------------------------------------
# `[fonts] code` and `[fonts] inline_code` in muya-default.toml both name
# "DejaVu Sans Mono" first. These are MarkText's own four files, byte-identical
# to the reference clone's — D7 recorded them as the half of the bundled set
# that loads (1,178,216 B, and the four hashes below prove they were copied,
# not re-downloaded).
#
# Last in the chain because it is the widest net (1,019 codepoints in
# U+2190–2BFF alone) and the least appropriate face to catch anything by
# accident: it is monospace, so every entry above it should win first.

[[face]]
