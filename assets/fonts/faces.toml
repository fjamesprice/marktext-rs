# ---------------------------------------------------------------------------
# 2. Noto Sans Arabic — before DejaVu Sans Mono, deliberately
# ---------------------------------------------------------------------------
# Two measurements put this face here rather than leaving Arabic to DejaVu Sans
# Mono, which S0 showed renders it (0/11 tofu):
#
#   * DejaVu Sans Mono is **monospace**. It is the code stack's family. Letting
#     it catch Arabic in a *body* paragraph makes Arabic prose render
#     monospaced — not tofu, but not right either, and a golden would freeze it.
#   * `DejaVuSansMono-Oblique.ttf` and `-BoldOblique.ttf` carry **0** codepoints
#     in U+0600–06FF, where the upright faces carry 99. S0 measured only the
#     upright. Emphasised Arabic therefore had no covering face at all before
#     this entry existed.
#
# Position matters: this must precede DejaVu Sans Mono so the chain reaches a
# proportional Arabic face first.

[[face]]
file = "NotoSansArabic-Regular.ttf"
family = "Noto Sans Arabic"
subfamily = "Regular"
weight = 400
style = "normal"
variable = false
axes = []
scripts = ["Arab"]
fallback_scripts = ["Arab"]
generic_families = []
role = "fallback"
derived = false
derived_from = ""
derived_command = ""
bytes = 271652
sha256 = "7ed3fe069312aceac454f17cf613a30f95271d6ed7ce58005ed4d016bd3823d7"

[[face]]
