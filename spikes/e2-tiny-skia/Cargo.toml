[package]
name = "e2-tiny-skia"
edition.workspace = true
version.workspace = true
publish.workspace = true
license.workspace = true

# Build 3: build 1 (parley + `vello_cpu`) plus `tiny-skia`. `tiny-skia` cannot
# draw text at all (its README lists text rendering as out of scope, tracked
# upstream as linebender/tiny-skia#1), so it is exercised with paths/rects —
# the vector-graphics work it actually does.
[dependencies]
e2-common = { path = "../e2-common" }
tiny-skia = "0.12.0"
