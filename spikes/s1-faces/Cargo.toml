[package]
name = "s1-faces"
edition.workspace = true
version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
# Same pin and same feature cut as `e1-fonts-main`, deliberately: this probe
# extends E1's font measurement, so it must not accidentally measure a
# different parley. D2 fixed the revision; D7 fixed the feature cut.
#
# NOTE ON BUILDING (the workspace manifest says this too): `cargo build
# --workspace` unifies features across the `e1-parley-*` members, which need
# `system`, and hands this crate a `parley` with filesystem enumeration
# switched back on. `cargo run -p s1-faces` does not. Only the latter's output
# is evidence for the no-I/O half of D7 — and the binary prints which it got.
parley = { git = "https://github.com/linebender/parley", rev = "a0752c7bdc3ad88dac19fc194d2b8e57e59bea2e", default-features = false, features = [
    "std",
] }

# `assets/fonts/faces.toml` is the artifact under test, and `mt-layout` already
# parses its theme with exactly these two (crates/mt-layout/Cargo.toml). Using
# the same pair here means the face list is proved loadable by the same
# machinery a later phase's `cargo xtask layout` will reach for.
serde = { version = "1", default-features = false, features = ["std", "derive"] }
toml = { version = "1", default-features = false, features = [
    "std",
    "parse",
    "serde",
] }

[features]
# Mirrors `e1-fonts-main`, so the two probes can be compared like for like.
# C9 measured this feature at +3.6 MiB and 0 extra crates.
complex-scripts = ["parley/complex-scripts"]
