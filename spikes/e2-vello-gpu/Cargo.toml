[package]
name = "e2-vello-gpu"
edition.workspace = true
version.workspace = true
publish.workspace = true
license.workspace = true

# Build 2: build 1 (parley + `vello_cpu`) plus the GPU renderer, both backends
# reachable from `main`. `vello` pulls `wgpu` (and `wgpu` pulls `naga`), which
# is §12.2's headline size lever — this crate exists to price it.
[dependencies]
e2-common = { path = "../e2-common" }
vello = "0.9.0"
pollster = "0.4"
