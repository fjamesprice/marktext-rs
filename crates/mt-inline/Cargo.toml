[package]
name = "mt-inline"
description = "Inline tokenizer: a faithful port of muya's inlineRenderer/lexer.ts. Pure."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# M1.md §5 D5, moved forward to S3 by S2's measurement. `harness = false`
# because there is no benchmarking framework: the target is a `fn main()` with
# a wall clock, which is what "a number per stage that can be compared with the
# previous stage's" needs and is all the dependency policy will carry.
# `test = false` keeps `cargo test --workspace` from running a benchmark as a
# test; `cargo clippy --all-targets` still builds it.
[[bench]]
name = "tokenizer"
harness = false
test = false

[dependencies]
# M1.md §4 C1. See the note in the workspace manifest for why this is not
# `regex`. Pure — no I/O, no windowing, no GPU — so §1 is preserved and
# `cargo xtask deps` stays green.
fancy-regex.workspace = true
