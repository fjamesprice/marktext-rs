# MarkText's shipped `dark` theme — M3 §5 D4.
#
# Source: `packages/desktop/src/renderer/src/assets/themes/dark.theme.css`
# (220 lines) and its paired `themes/prismjs/dark.theme.css` (126 lines).
#
# `dark` is **not** one of the three geometry outliers — `graphite`, `one-dark`
# and `ulysses` are — so it exists here as the colour-only counterpart to
# `muya-default`, and to make the 800/750 golden comparison meaningful.
#
# It differs from `muya-default` on exactly two geometric axes:
#
#   1. `--editorAreaWidth: 750px` (dark.theme.css:90) aliased onto
#      `--editor-area-width` (dark.theme.css:107). Every one of the 32 shipped
#      themes does this; muya's own default is 800px.
#   2. `pre.mu-code-block { border: none !important }` (dark.theme.css:200-206),
#      which zeroes muya's 1px code-block border. **30 of the 32 shipped themes
#      carry that rule** — only `graphite` and `ulysses` do not — so the
#      code-block border is a second theme-controlled geometry axis, and one
#      that M3 §2's table and §5 D4's "3 of 32 override geometry" count both
#      miss.
#
# Two rules in this file that look like geometry are not:
#   * `.mu-thematic-break:not(.mu-active)::before` (dark.theme.css:207-210)
#     restates muya's own `2px dashed` with a different colour variable.
#   * The whole theme patch is wrapped in `@media not print`
#     (`util/theme.ts:48-51`), so during printing and PDF export none of it
#     applies and the base 800px / 1px-border geometry returns. That is M6's
#     problem, recorded here because it is invisible from the CSS alone.
#
# The 41 kebab-case names at dark.theme.css:97-137 are aliases onto the
# camelCase block above them; the values below are those chains resolved.
# Fractional alphas are rounded to the nearest 1/255: 4% -> 0a, 5% -> 0d,
# 10% -> 1a, 20% -> 33, 30% -> 4d, 50% -> 80, 56% -> 8f, 60% -> 99, 70% -> b3,
# 80% -> cc.

name = "dark"

# ---------------------------------------------------------------------------
# Page — identical to muya-default except the content column.
# ---------------------------------------------------------------------------

[metrics]
# dark.theme.css:90, aliased at :107. The whole point of shipping two themes.
content_width_px = 750.0
container_padding_top_px = 0.0
container_padding_x_px = 50.0
container_padding_bottom_px = 100.0
# No theme sets --mu-font-size or --mu-line-height; these are muya's fallbacks.
font_size_px = 16.0
line_height = 1.6
root_font_size_px = 16.0
block_margin_em = 0.5

# No theme file sets font-family — zero declarations across all 32 — so these
# are muya's own stacks, unchanged.
[fonts]
body = ["Open Sans", "Clear Sans", "Helvetica Neue", "Helvetica", "Arial", "sans-serif"]
code = ["DejaVu Sans Mono", "Source Code Pro", "Droid Sans Mono", "Consolas", "monospace"]
inline_code = ["DejaVu Sans Mono", "Source Code Pro", "Droid Sans Mono", "Consolas", "monospace"]

# ---------------------------------------------------------------------------
# Blocks — geometry unchanged from muya-default apart from the code-block
# border. `dark` touches no `.mu-*` selector's layout.
# ---------------------------------------------------------------------------

[headings]
scale_em = [1.875, 1.5, 1.375, 1.25, 1.125, 1.0]
margin_rem = 1.0
line_height = 1.4
bold = true
align = "start"

[blockquote]
margin_em = 0.5
padding_x_px = 30.0
font_size_em = 1.0
bar_width_px = 2.0
bar_inset_px = 15.0
nested_padding_end_px = 0.0

[code_block]
margin_top_em = 1.5
margin_bottom_em = 1.0
padding_em = 1.0
font_size_pct = 90.0
line_height = 1.6
# `border: none !important` — dark.theme.css:205. Not 1px.
border_width_px = 0.0
corner_radius_px = 3.0
gutter_width_em = 2.5
gutter_top_em = 1.0
gutter_padding_end_em = 0.8
gutter_scale = 0.8
gutter_letter_spacing_px = -1.0

[inline_code]
padding_x_em = 0.4
padding_y_em = 0.2
font_size_em = 0.8
corner_radius_px = 3.0

[lists]
indent_px = 30.0
task_indent_px = 30.0
margin_em = 0.5
nested_margin_em = 0.0
bullet_markers = ["disc", "circle", "square"]
ordered_marker = "decimal"

[checkbox]
# Unchanged. `dark` has no `li.mu-task-list-item` rule at all — that is what
# separates it from `graphite`, `one-dark` and `ulysses`.
shape = "circle"
box_size_px = 12.0
inset_inline_start_px = -23.0
unchecked_rotation_deg = 0.0
ring_size_px = 18.0
ring_offset_px = -2.0
ring_border_px = 2.0
ring_corner_radius_px = 9.0
check_width_px = 8.0
check_height_px = 4.0
check_border_px = 2.0
check_left_px = 4.0
check_top_px = 1.0
check_rotation_deg = -45.0

[checkbox.top.line-centered]
offset_px = 7.0

[table]
figure_margin_top_em = 0.5
figure_margin_bottom_em = 0.0
figure_padding_y_em = 0.5
inner_margin_em = 0.5
cell_padding_x_px = 13.0
cell_padding_y_px = 6.0
cell_border_px = 1.0
cell_min_width_em = 10.0
collapse_borders = true
header_bold = true

[thematic_break]
# dark.theme.css:207-210 restates `2px dashed` with --editorColor10. Colour
# only; the geometry is muya's.
width_fraction = 1.0
left_fraction = 0.0
center_fraction = 0.5
thickness_px = 2.0
style = "dashed"

[footnote]
margin_y_em = 1.4
padding_top_em = 1.2
padding_end_em = 2.0
padding_bottom_em = 0.05
padding_start_em = 1.0
font_size_em = 0.8

# ---------------------------------------------------------------------------
# Colour — dark.theme.css:3-137, with the camelCase alias chains resolved.
# ---------------------------------------------------------------------------

[colors]
theme = "#409effff"
highlight = "#66b1ff99"
selection = "#66b1ff4d"
editor = "#ffffffb3"
editor_80 = "#ffffffcc"
editor_50 = "#ffffff80"
editor_30 = "#ffffff4d"
editor_10 = "#ffffff1a"
editor_04 = "#ffffff0a"
editor_bg = "#282828ff"
delete = "#409effff"
icon = "#ffffff8f"
code_block_bg = "#424344ff"
table_border = "#363839ff"
float_bg = "#3f3f3fff"
float_border = "#0000000d"
link = "#409effff"
heading = ["#ffffffcc", "#ffffffcc", "#ffffffcc", "#ffffffcc", "#ffffffcc", "#ffffffcc"]
blockquote_text = "#ffffff80"
blockquote_border = "#409effff"
strong = "#ffffffcc"
em = "#66b1ffff"
list_marker = "#409effff"
hr = "#ffffff1a"
# dark.theme.css:124 — the same three layers as muya's own default.
float_shadow = [
    { x_px = 0.0, y_px = 0.0, blur_px = 0.0, spread_px = 1.0, color = "#0f0f0f08" },
    { x_px = 0.0, y_px = 3.0, blur_px = 6.0, spread_px = 0.0, color = "#0f0f0f0a" },
    { x_px = 0.0, y_px = 9.0, blur_px = 24.0, spread_px = 0.0, color = "#0f0f0f0d" },
]

[chrome]
button_font = "#ffffff99"
button_bg = "#424344ff"
button_bg_hover = { solid = "#4f5051ff" }
button_bg_active = "#333434ff"
button_border = { width_px = 1.0, style = "solid", color = "#00000033" }
button_border_hover = { width_px = 1.0, style = "solid", color = "#0000004d" }
button_border_active = { width_px = 1.0, style = "solid", color = "#00000033" }
button_border_focus = { width_px = 1.0, style = "solid", color = "#00000033" }
float_hover = "#ffffff0a"
input_bg = "#2f3336ff"

# ---------------------------------------------------------------------------
# Code palette — `themes/prismjs/dark.theme.css`, a Monokai derivative.
#
# `plain` is `code[class*='language-'] { color: #f8f8f2 }` (line 7). Note that
# its `pre.ag-paragraph { background: #272822 }` (line 36) targets the *legacy*
# `ag-` editor and never reaches muya v2, whose code-block background comes
# from `--codeBlockBgColor` instead.
#
# The class *set* matches muya's light sheet exactly; the groupings do not.
# `boolean`/`number` split away from `property`, `function`/`class-name` join
# `atrule`, and `keyword` gets a colour of its own.
# ---------------------------------------------------------------------------

[code_palette]
plain = { color = "#f8f8f2ff", background = "transparent", bold = false, italic = false, opacity = 1.0 }
comment = { color = "#708090ff", background = "transparent", bold = false, italic = false, opacity = 1.0 }
prolog = { color = "#708090ff", background = "transparent", bold = false, italic = false, opacity = 1.0 }
doctype = { color = "#708090ff", background = "transparent", bold = false, italic = false, opacity = 1.0 }
cdata = { color = "#708090ff", background = "transparent", bold = false, italic = false, opacity = 1.0 }
punctuation = { color = "#f8f8f2ff", background = "transparent", bold = false, italic = false, opacity = 1.0 }
namespace = { color = "inherit", background = "transparent", bold = false, italic = false, opacity = 0.7 }
property = { color = "#f92672ff", background = "transparent", bold = false, italic = false, opacity = 1.0 }
tag = { color = "#f92672ff", background = "transparent", bold = false, italic = false, opacity = 1.0 }
boolean = { color = "#ae81ffff", background = "transparent", bold = false, italic = false, opacity = 1.0 }
number = { color = "#ae81ffff", background = "transparent", bold = false, italic = false, opacity = 1.0 }
constant = { color = "#f92672ff", background = "transparent", bold = false, italic = false, opacity = 1.0 }
symbol = { color = "#f92672ff", background = "transparent", bold = false, italic = false, opacity = 1.0 }
selector = { color = "#a6e22eff", background = "transparent", bold = false, italic = false, opacity = 1.0 }
attr_name = { color = "#a6e22eff", background = "transparent", bold = false, italic = false, opacity = 1.0 }
string = { color = "#a6e22eff", background = "transparent", bold = false, italic = false, opacity = 1.0 }
char = { color = "#a6e22eff", background = "transparent", bold = false, italic = false, opacity = 1.0 }
builtin = { color = "#a6e22eff", background = "transparent", bold = false, italic = false, opacity = 1.0 }
inserted = { color = "#22863aff", background = "#f0fff4ff", bold = false, italic = false, opacity = 1.0 }
deleted = { color = "#b31d28ff", background = "#ffeef0ff", bold = false, italic = false, opacity = 1.0 }
operator = { color = "#e67e65ff", background = "transparent", bold = false, italic = false, opacity = 1.0 }
entity = { color = "#e67e65ff", background = "transparent", bold = false, italic = false, opacity = 1.0 }
url = { color = "#e67e65ff", background = "transparent", bold = false, italic = false, opacity = 1.0 }
atrule = { color = "#e6db74ff", background = "transparent", bold = false, italic = false, opacity = 1.0 }
attr_value = { color = "#e6db74ff", background = "transparent", bold = false, italic = false, opacity = 1.0 }
keyword = { color = "#66d9efff", background = "transparent", bold = false, italic = false, opacity = 1.0 }
function = { color = "#e6db74ff", background = "transparent", bold = false, italic = false, opacity = 1.0 }
class_name = { color = "#e6db74ff", background = "transparent", bold = false, italic = false, opacity = 1.0 }
regex = { color = "#fd971fff", background = "transparent", bold = false, italic = false, opacity = 1.0 }
important = { color = "#fd971fff", background = "transparent", bold = true, italic = false, opacity = 1.0 }
variable = { color = "#fd971fff", background = "transparent", bold = false, italic = false, opacity = 1.0 }
bold = { color = "inherit", background = "transparent", bold = true, italic = false, opacity = 1.0 }
italic = { color = "inherit", background = "transparent", bold = false, italic = true, opacity = 1.0 }
