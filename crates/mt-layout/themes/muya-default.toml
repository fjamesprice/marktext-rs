# muya's own base stylesheet, as a theme — M3 §5 D4.
#
# Source: `packages/muya/src/assets/styles/` in the reference clone.
#   * `index.css:1-55`      the `:root` block, which defines 41 of the 46
#                           custom properties muya's own CSS consumes
#   * `blockSyntax.css`     block geometry, and the `var(--x, fallback)`
#                           fallbacks for the 5 `--mu-*` names no sheet defines
#   * `inlineSyntax.css`    inline code, inline images, inline math
#   * `prismjs/light.theme.css`  the paired code palette
#
# **This is the real default case.** MarkText's `light` theme has no
# `.theme.css` file: it is this stylesheet plus a two-line patch that bridges
# `--link-color` and `--blockquote-border-color` (`util/theme.ts:71-74`). The
# kebab-case `--editor-area-width` alias that carries the desktop's 750px lives
# only inside the 32 named theme files, so an install that never picks a theme
# gets muya's own **800px**.
#
# Every `em`, `rem` and `%` is left in the unit the CSS used; see the `theme`
# module doc for what each one multiplies.

name = "muya-default"

# ---------------------------------------------------------------------------
# Page
# ---------------------------------------------------------------------------

[metrics]
# `.mu-container { max-width: var(--editor-area-width, 800px) }` — blockSyntax.css:18
content_width_px = 800.0
# `padding: 0 50px 100px` — blockSyntax.css:21
container_padding_top_px = 0.0
container_padding_x_px = 50.0
container_padding_bottom_px = 100.0
# `.mu-editor` — blockSyntax.css:2, 4
font_size_px = 16.0
line_height = 1.6
# `html, body { font-size: 16px }` — index.css:206. What `rem` resolves against.
root_font_size_px = 16.0
# `margin: 0.5em 0` on p / blockquote / ul / ol / dl / table — blockSyntax.css:33
block_margin_em = 0.5

[fonts]
# blockSyntax.css:3, identically index.css:207
body = ["Open Sans", "Clear Sans", "Helvetica Neue", "Helvetica", "Arial", "sans-serif"]
# The `--mu-code-font-family` fallback — blockSyntax.css:220-227
code = ["DejaVu Sans Mono", "Source Code Pro", "Droid Sans Mono", "Consolas", "monospace"]
# A literal stack, not the variable — inlineSyntax.css:66
inline_code = ["DejaVu Sans Mono", "Source Code Pro", "Droid Sans Mono", "Consolas", "monospace"]

# ---------------------------------------------------------------------------
# Blocks
# ---------------------------------------------------------------------------

[headings]
# h1 1.875em, h2 1.5em, h3 1.375em, h4 1.25em, h5 1.125em, h6 1em
# — blockSyntax.css:57, 62, 67, 72, 77, 82. Not the UA scale.
scale_em = [1.875, 1.5, 1.375, 1.25, 1.125, 1.0]
# `margin: 1rem 0` — blockSyntax.css:45. rem, so it does not track --mu-font-size.
margin_rem = 1.0
line_height = 1.4
bold = true
# muya sets no text-align; `ulysses` centres every heading.
align = "start"

[blockquote]
margin_em = 0.5
# `padding: 0 30px` — blockSyntax.css:142
padding_x_px = 30.0
# Explicit `font-size: 1em` — blockSyntax.css:146, so nesting does not compound.
font_size_em = 1.0
# The ::before bar — blockSyntax.css:152, 155
bar_width_px = 2.0
bar_inset_px = 15.0
# `blockquote blockquote { padding-right: 0 }` — blockSyntax.css:163-165
nested_padding_end_px = 0.0

[code_block]
# blockSyntax.css:204
margin_top_em = 1.5
# NOT muya's: `.mu-code-block` is a <pre> and only margin-top is set, so the
# bottom margin is Chromium's UA `pre { margin: 1em 0 }`.
margin_bottom_em = 1.0
# blockSyntax.css:205
padding_em = 1.0
# `var(--mu-code-font-size, 90%)` — blockSyntax.css:219. Percent of the parent.
font_size_pct = 90.0
# blockSyntax.css:210. Multiplies the block's own 14.4px, not the editor's 16px.
line_height = 1.6
# `border: 1px solid var(--editor-color-10)` — blockSyntax.css:213.
# 30 of the 32 shipped themes zero this with `border: none !important`.
border_width_px = 1.0
corner_radius_px = 3.0
# Line-number gutter — blockSyntax.css:323-334, 359, 364, 336
gutter_width_em = 2.5
gutter_top_em = 1.0
gutter_padding_end_em = 0.8
gutter_scale = 0.8
gutter_letter_spacing_px = -1.0

[inline_code]
# `padding: 0.2em 0.4em` — inlineSyntax.css:62
padding_x_em = 0.4
padding_y_em = 0.2
# Relative to the surrounding text, so 24px inside an h1 — inlineSyntax.css:65
font_size_em = 0.8
corner_radius_px = 3.0

[lists]
# `padding-inline-start: 30px` — blockSyntax.css:410, 481
indent_px = 30.0
task_indent_px = 30.0
margin_em = 0.5
# `li > ol, li > ul { margin: 0 }` — blockSyntax.css:422-425
nested_margin_em = 0.0
# The browser cascade muya follows — blockSyntax.css:417-456
bullet_markers = ["disc", "circle", "square"]
# `list-style: decimal outside none` — blockSyntax.css:413-415
ordered_marker = "decimal"

[checkbox]
# blockSyntax.css:490-577. A 12x12 target inside an 18x18 circular ring at
# -23px. `graphite`, `one-dark` and `ulysses` replace all of it.
shape = "circle"
box_size_px = 12.0
inset_inline_start_px = -23.0
unchecked_rotation_deg = 0.0
ring_size_px = 18.0
ring_offset_px = -2.0
ring_border_px = 2.0
# `border-radius: 50%` on an 18px box.
ring_corner_radius_px = 9.0
check_width_px = 8.0
check_height_px = 4.0
check_border_px = 2.0
check_left_px = 4.0
check_top_px = 1.0
check_rotation_deg = -45.0

# `top: calc(var(--mu-line-height) * 0.5 * var(--mu-font-size) - 7px)`
# — blockSyntax.css:502. A formula, so the marker tracks the editor font.
[checkbox.top.line-centered]
offset_px = 7.0

[table]
# `.mu-table { margin: 0.5em 0 0; padding: 0.5em 0 }` — blockSyntax.css:581-582.
# Asymmetric: the table figure is excluded from the shared figure rule.
figure_margin_top_em = 0.5
figure_margin_bottom_em = 0.0
figure_padding_y_em = 0.5
# The inner <table> still matches `.mu-container table`'s 0.5em, which
# `.mu-table-inner` does not reset — blockSyntax.css:31-33, 585-591.
inner_margin_em = 0.5
# `padding: 6px 13px` — blockSyntax.css:602, 613
cell_padding_x_px = 13.0
cell_padding_y_px = 6.0
# Drawn as an absolutely-positioned ::before overlay — blockSyntax.css:630
cell_border_px = 1.0
# `.mu-table-cell-content { min-width: 10em }` — blockSyntax.css:972-974
cell_min_width_em = 10.0
collapse_borders = true
header_bold = true

[thematic_break]
# blockSyntax.css:172-186. The element is a paragraph carrying hidden source
# text, so it occupies a full line; this is the ::before drawn across it.
width_fraction = 1.0
left_fraction = 0.0
center_fraction = 0.5
thickness_px = 2.0
style = "dashed"

[footnote]
# `margin: 1.4em 0; padding: 1.2em 2em 0.05em 1em; font-size: 0.8em`
# — blockSyntax.css:992-995
margin_y_em = 1.4
padding_top_em = 1.2
padding_end_em = 2.0
padding_bottom_em = 0.05
padding_start_em = 1.0
font_size_em = 0.8

# ---------------------------------------------------------------------------
# Colour — index.css:1-55, with `var()` chains resolved.
#
# Fractional alphas are rounded to the nearest 1/255: 3% -> 08, 4% -> 0a,
# 6% -> 0f, 10% -> 1a, 30% -> 4d, 40% -> 66.
# ---------------------------------------------------------------------------

[colors]
theme = "#21b56fff"
highlight = "#21b56f66"
selection = "#2daadb4d"
editor = "#4d4d4dff"
editor_80 = "#333333ff"
editor_50 = "#808080ff"
editor_30 = "#b3b3b3ff"
editor_10 = "#e6e6e6ff"
editor_04 = "#f7f7f7ff"
editor_bg = "#ffffffff"
delete = "#ff6969ff"
icon = "#6b737bff"
code_block_bg = "#00000008"
table_border = "#e5e5e5ff"
float_bg = "#ffffffff"
float_border = "#0000001a"
link = "#1456f0ff"
heading = ["#333333ff", "#333333ff", "#333333ff", "#333333ff", "#333333ff", "#333333ff"]
blockquote_text = "#808080ff"
blockquote_border = "#b3b3b3ff"
strong = "inherit"
em = "inherit"
list_marker = "inherit"
hr = "#e6e6e6ff"
float_shadow = [
    { x_px = 0.0, y_px = 0.0, blur_px = 0.0, spread_px = 1.0, color = "#0f0f0f08" },
    { x_px = 0.0, y_px = 3.0, blur_px = 6.0, spread_px = 0.0, color = "#0f0f0f0a" },
    { x_px = 0.0, y_px = 9.0, blur_px = 24.0, spread_px = 0.0, color = "#0f0f0f0d" },
]

# Consumed by muya's `ui/*/index.css` only. `mt-layout` never reads these; they
# are carried so a Theme is a complete transcription of a theme file.
[chrome]
button_font = "#4d4d4dff"
button_bg = "#ffffffff"
button_bg_hover = { linear-gradient = ["#f9f9f9ff", "#f2f2f2ff"] }
button_bg_active = "#ffffffff"
button_border = { width_px = 1.0, style = "solid", color = "#dcdfe6ff" }
button_border_hover = { width_px = 1.0, style = "solid", color = "#dcdfe6ff" }
button_border_active = { width_px = 1.0, style = "solid", color = "#dcdfe6ff" }
button_border_focus = { width_px = 1.0, style = "solid", color = "#dcdfe6ff" }
float_hover = "#0000000a"
input_bg = "#0000000f"

# ---------------------------------------------------------------------------
# Code palette — muya's own `prismjs/light.theme.css`, the sheet a no-theme
# install gets. `slategray` is #708090.
#
# `plain` is not in that file: code text with no token class takes
# `.mu-code-block { color: var(--editor-color-50) }` (blockSyntax.css:207).
# ---------------------------------------------------------------------------

[code_palette]
plain = { color = "#808080ff", background = "transparent", bold = false, italic = false, opacity = 1.0 }
comment = { color = "#708090ff", background = "transparent", bold = false, italic = false, opacity = 1.0 }
prolog = { color = "#708090ff", background = "transparent", bold = false, italic = false, opacity = 1.0 }
doctype = { color = "#708090ff", background = "transparent", bold = false, italic = false, opacity = 1.0 }
cdata = { color = "#708090ff", background = "transparent", bold = false, italic = false, opacity = 1.0 }
punctuation = { color = "#999999ff", background = "transparent", bold = false, italic = false, opacity = 1.0 }
namespace = { color = "inherit", background = "transparent", bold = false, italic = false, opacity = 0.7 }
property = { color = "#990055ff", background = "transparent", bold = false, italic = false, opacity = 1.0 }
tag = { color = "#990055ff", background = "transparent", bold = false, italic = false, opacity = 1.0 }
boolean = { color = "#990055ff", background = "transparent", bold = false, italic = false, opacity = 1.0 }
number = { color = "#990055ff", background = "transparent", bold = false, italic = false, opacity = 1.0 }
constant = { color = "#990055ff", background = "transparent", bold = false, italic = false, opacity = 1.0 }
symbol = { color = "#990055ff", background = "transparent", bold = false, italic = false, opacity = 1.0 }
selector = { color = "#669900ff", background = "transparent", bold = false, italic = false, opacity = 1.0 }
attr_name = { color = "#669900ff", background = "transparent", bold = false, italic = false, opacity = 1.0 }
string = { color = "#669900ff", background = "transparent", bold = false, italic = false, opacity = 1.0 }
char = { color = "#669900ff", background = "transparent", bold = false, italic = false, opacity = 1.0 }
builtin = { color = "#669900ff", background = "transparent", bold = false, italic = false, opacity = 1.0 }
inserted = { color = "#22863aff", background = "#f0fff4ff", bold = false, italic = false, opacity = 1.0 }
deleted = { color = "#b31d28ff", background = "#ffeef0ff", bold = false, italic = false, opacity = 1.0 }
operator = { color = "#9a6e3aff", background = "transparent", bold = false, italic = false, opacity = 1.0 }
entity = { color = "#9a6e3aff", background = "transparent", bold = false, italic = false, opacity = 1.0 }
url = { color = "#9a6e3aff", background = "transparent", bold = false, italic = false, opacity = 1.0 }
atrule = { color = "#0077aaff", background = "transparent", bold = false, italic = false, opacity = 1.0 }
attr_value = { color = "#0077aaff", background = "transparent", bold = false, italic = false, opacity = 1.0 }
keyword = { color = "#0077aaff", background = "transparent", bold = false, italic = false, opacity = 1.0 }
function = { color = "#dd4a68ff", background = "transparent", bold = false, italic = false, opacity = 1.0 }
class_name = { color = "#dd4a68ff", background = "transparent", bold = false, italic = false, opacity = 1.0 }
regex = { color = "#ee9900ff", background = "transparent", bold = false, italic = false, opacity = 1.0 }
important = { color = "#ee9900ff", background = "transparent", bold = true, italic = false, opacity = 1.0 }
variable = { color = "#ee9900ff", background = "transparent", bold = false, italic = false, opacity = 1.0 }
bold = { color = "inherit", background = "transparent", bold = true, italic = false, opacity = 1.0 }
italic = { color = "inherit", background = "transparent", bold = false, italic = true, opacity = 1.0 }
