[package]
name = "mt-layout"
description = "Block flow plus inline layout, producing a positioned display list. No GPU."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
mt-doc.workspace = true
mt-inline.workspace = true

# The theme model (M3.md §5 D4): a typed `Theme` whose fields are all required,
# deserialized from TOML. See the workspace manifest for why TOML rather than
# Rust consts, and for the feature cuts. Both crates are pure — no I/O, no
# windowing, no GPU — so `mt-layout` stays on `cargo xtask deps`' headless list.
serde.workspace = true
toml.workspace = true

# The text engine (M3.md §5 D2, D7, D8). See the workspace manifest for the pin,
# for why `default-features = false` is load-bearing rather than tidy, and for
# the `complex-scripts` measurement. `parley::Layout` is held behind
# `mt-layout`'s own display list and names no public type here — D8.
parley.workspace = true

[dev-dependencies]
# The bidi oracle for S2's gate, and the one deliberate exception to this
# crate's hand-rolled-over-dependency habit. See the workspace manifest for
# why, and `tests/inline.rs` for the method it implements. Dev-only, so it is
# in no shipped binary and changes nothing about the headless rules.
unicode-bidi.workspace = true
