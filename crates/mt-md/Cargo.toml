[package]
name = "mt-md"
description = "Markdown to Document and back. Round-trip fidelity is this crate's contract."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
mt-doc.workspace = true

# M2 S1, per M2.md §5 D1. Block structure only — the event stream is mapped
# onto `mt_doc::Block` by `src/block.rs` and the inline events are never read,
# because muya's leaf text is unparsed inline source (§4 C2) and `mt-inline` is
# what tokenizes it. `default-features = false` drops the HTML writer, which
# §4 C3 decides nothing will call.
pulldown-cmark.workspace = true

# M2 S1. `dump_state` returns muya-compatible state JSON (M0), so the
# serializer belongs here rather than in the harness that reads it; `src/state.rs`
# is what `cargo xtask blocks` compares today and what `dump_state` returns at S3.
serde_json.workspace = true

[dev-dependencies]
# M2 S0. `tests/state_specs.rs` transcribes `state/__tests__/`, and two of its
# nineteen modules drive the inline tokenizer as well as the parser:
# `referenceLink` runs the whole markdown → state → label-map → tokenize
# pipeline (M2.md §5 D3), and `strongCjkFlanking` asserts the live-editor half
# of #4307 beside the export half.
#
# `mt-doc → mt-inline → mt-md → mt-layout` is §1's order, so this is a
# downward edge and `mt-md`'s own crate doc already anticipates it ("on
# `mt-inline` once inline re-derivation lands"). A `[dev-dependencies]` entry
# does not reach `mt-md`'s build; §1's purity constraint is about `src/`, which
# is what `cargo xtask deps` scans.
mt-inline.workspace = true
