[package]
name = "xtask"
description = "Build, test-harness and packaging automation. Not shipped."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
serde_json.workspace = true
mt-md.workspace = true
# M1 S7: the token-stream half of the differential harness serializes real
# `mt_inline::Token`s into muya's wire shape and compares them field by field
# (`src/tokens.rs`). `xtask` is not one of the four headless crates `cargo xtask
# deps` constrains — it is dev tooling that nothing ships — so depending upward
# on a workspace crate here does not touch the §1 dependency direction. The
# alternative was a `--dump-tokens` mode on `mt-cli` and a second process per
# run, which buys nothing: this comparison is in-process on the Rust side.
mt-inline.workspace = true
# M3 S1: `cargo xtask layout` (D10) builds the font collection D7 says lives
# *above* `mt-layout`, lays every `bench/corpus/` input out at both shipped
# themes and compares the serialized display list against a committed golden.
# `mt-layout` is where the display list and the theme model live, so the edge
# is unavoidable and — like the two above — points upward from dev tooling that
# nothing ships, which is why §1's dependency direction is untouched by it.
#
# **The cost is real and is recorded here rather than discovered.** This edge
# pulls parley (and with it fontique, swash, skrifa and the ICU4X segmenter)
# into `cargo xtask`'s build, so *every* `cargo xtask <anything>` invocation
# now compiles them once. The alias is `cargo run --package xtask`, i.e. the
# dev profile, so the corpus's three large files are laid out unoptimised —
# see `layout.rs`'s note on what that costs.
mt-layout.workspace = true
# M3 S3: `cargo xtask highlight` (D14/D15) collects every fenced code block in
# `bench/corpus/` and needs two things from `mt-doc` to do it — `Block`, to
# recognise a `CodeBlock` while walking the tree `mt_md::parse` returns, and
# `Block::highlight_language()`, which `mt-highlight`'s crate contract names as
# the **only** legitimate source of a fence's language (*"never take the whole
# info string as a language name"*).
#
# The edge is cheap and it is unavoidable. Cheap: `mt-doc` is the bottom of the
# workspace and was already being compiled as a dependency of the three crates
# above, so this adds no build time and no third-party code. Unavoidable: Rust
# has no transitive `use`, and the alternatives were both worse — reproducing
# the first-word rule here would give this harness a second opinion about what a
# fence's language is, which is the one thing a differential must never have,
# and going through `mt_layout::code_language` would silently widen S3's gate to
# D11's four non-fence block kinds.
mt-doc.workspace = true
# M3 S3: `rust_spans` in `src/highlight.rs` is the seam the harness was built
# around — *"when `mt-highlight` grows an entry point, that function stops
# returning `None` and this module gains a dependency edge; nothing else here
# changes shape."* This is that edge. Upward from dev tooling, like the four
# above, and it costs nothing that is not already paid: `mt-highlight`'s only
# dependency is `fancy-regex`, which `mt-inline` already pulls in here.
mt-highlight.workspace = true
# M3 S3: the grammar generator (`src/grammars.rs`, D14) compiles **every**
# pattern it translates with the same engine `mt-highlight` will use, before it
# writes a byte. That check is the entire reason the JS → Rust regex translation
# lives on the Rust side of the generator rather than in the Node dumper — a
# translator that cannot compile its own output can only be checked by eye. No
# new third-party code: `fancy-regex` arrives here anyway through `mt-inline`
# and now `mt-highlight`, so this line names an existing edge rather than adding
# one.
fancy-regex.workspace = true

# **M3 S4.** This started the same day as a `[dev-dependencies]` line, on the
# rule that *a dependency declared before the command that needs it is how a
# subcommand gets built by accident*. `cargo xtask frames` is that command:
# D17's scroll measurement (`src/frames.rs`) renders `bench/corpus/5mb.md`
# through `mt_render::Renderer` at nine scroll offsets, and D1's verdict is read
# off its output. So the edge moves up here, having earned it, rather than
# having been anticipated.
#
# **Why the measurement lives in `xtask` and not in `crates/mt-render/benches/`,
# which is where `crates/mt-inline/benches/tokenizer.rs` sets the precedent.**
# A frame must be timed over *the display list the goldens describe*, and
# building that one takes five things `xtask` already has and `mt-render` has
# none of: `Provenance::read` + `build_collection` (the sha256-verified twelve
# faces, registered in `faces.toml` order, which is what makes a `FontId` mean
# anything), `parse_options`, and `layout_options` — which carries D15's
# highlight spans, so without it `5mb.md`'s 1,954 fences lay out as *fewer,
# longer, uncoloured glyph runs* and the frame timed is a frame over a different
# document. A bench target on `mt-render` would have to duplicate all of it and
# take `mt-md` and `mt-highlight` as new dev-dependencies to do so, which is a
# second opinion about how the corpus is laid out — the one thing a measurement
# that will be compared against a golden must not have. D17 also expects it
# here: *"`xtask` has no timing convention to inherit and this is the first
# one."*
#
# It costs one crate: `mt-render`'s own dependency is `vello_cpu`, which nothing
# else here pulls in, and `mt-layout` is already above. Every `cargo xtask
# <anything>` now compiles it; that is the price of the command, recorded here
# rather than discovered.
mt-render.workspace = true
