[workspace]
members = ["crates/*", "xtask"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.85"
# Not specified in RUST-REWRITE-PLAN.md §1; added because every member needs a
# version and a license field. Everything above this line is verbatim from §1.
version = "0.1.0"
license = "MIT"
repository = "https://github.com/fjamesprice/marktext-rs"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

[profile.dist]          # size-tuned; see §12
inherits = "release"
opt-level = "s"

# ---------------------------------------------------------------------------
# Workspace dependencies
#
# M0 policy: the dependency tables in §8 and §12 of the plan are the plan of
# record, NOT something to front-load here. Nothing heavy (wgpu, vello, parley,
# swash, tree-sitter, pulldown-cmark, winit, accesskit, …) is added until the
# milestone that needs it. Adding them early would inflate CI time and lock in
# versions before the crates that use them have a shape.
#
# The only third-party dependency at M0 is `serde_json`, used by `xtask` for
# the conformance ratchet (§11.1) and the differential harness (§11.2) — both
# of which read and diff JSON. It is dev tooling, not a shipped dependency.
#
# `fancy-regex` is the first third-party dependency of a *shipped* crate, added
# at M1 S1 for `mt-inline`. It is scheduled by the milestone that needs it, so
# it is consistent with the policy above rather than an exception to it.
#
# §3 asks for the `regex` crate. M1.md §4 C1 corrects that: 16 of `rules.ts`'s
# 26 regexes need a backreference, a lookahead or a lookbehind, none of which
# `regex` has by design. `fancy-regex` wraps `regex` and adds exactly those,
# delegating whole patterns to the non-backtracking engine when they do not
# need the extra power — so the 10 plain rules keep `regex`'s performance and
# §3's "port the regexes verbatim, hand-optimize later with the suite as the
# guard" sequencing survives intact.
#
# It satisfies §1's purity constraint for `mt-inline`: no I/O, no windowing,
# no GPU. Its own tree is `regex` + `bit-set`, both pure.
# ---------------------------------------------------------------------------
# `proptest` is the third third-party crate and the second scheduled one: M1.md
# §5 D6 puts property testing in the normal test job on all three platforms,
# with the 24-hour libFuzzer soak on Linux only, and S7 is the stage that owes
# both. It is a `[dev-dependencies]` entry of `mt-inline` alone — it does not
# reach that crate's own build, and §1's purity constraint is about `src/`,
# which `cargo xtask deps` is what scans.
#
# `libfuzzer-sys` and `arbitrary` are deliberately **not** here: `fuzz/` is its
# own workspace (`fuzz/Cargo.toml` carries `[workspace]`), because cargo-fuzz
# needs a nightly toolchain and `-Zbuild-std`, and pulling either into this
# lockfile would put a nightly-only dependency in front of every `cargo build`
# on three platforms for the sake of one Linux job.
# `ropey` is the fourth third-party crate and the third scheduled one. §2.1
# names it by name — `Rope(Rope),  // ropey, promoted on threshold` — and M0
# decision 4 wrote `mt_doc::Text::Rope` as a newtype over `String` precisely so
# that adopting it at M2 would be a body swap with the enum untouched. M2.md
# §5 D8 is where that falls due, and this is the milestone that needs it.
#
# It satisfies §1's purity constraint for `mt-doc`: no I/O, no windowing, no
# GPU. Its only dependencies are `smallvec` and `str_indices`, both pure.
#
# `pulldown-cmark` is the fifth third-party crate and the fourth scheduled one.
# It is named in the "not until the milestone that needs it" list above, and
# M2 S1 is that milestone: §4 says "`pulldown-cmark` for block structure only"
# and M2.md §5 D1 adopts it after measuring it — 1167 of 1344 inputs agree with
# `MarkdownToState` on the block-name tree before any mapping work, and all 177
# residual disagreements are four named mechanisms in the mapping layer rather
# than the parser putting a block boundary where `marked` does not.
#
# `default-features = false` drops the `html` feature (and with it
# `pulldown-cmark-escape`): the port maps the **event stream** onto
# `mt_doc::Block` and never asks this crate to render. M2.md §4 C3 decides that
# `render_to_static_html` goes through `Document`, so there is no path on which
# the built-in HTML writer is wanted. What is left is `bitflags`, `memchr` and
# `unicase` — all pure, so §1's constraint for `mt-md` holds and
# `cargo xtask deps` stays green.
#
# `serde_json` stops being dev-only here. `mt_md::dump_state` returns muya-
# compatible state JSON by M0's design, so producing JSON is `mt-md`'s job and
# not `xtask`'s; S1 needs the serializer early because `cargo xtask blocks`
# compares against exactly the tree `dump_state` will emit at S3. Pure, and
# already in the lockfile.
#
# `ammonia` is the sixth third-party crate and the fifth scheduled one. §4's
# table names it — "`Document` → HTML: port `renderToStaticHTML.ts`, sanitize
# with `ammonia`" — and M2.md §6's S5 row names it again. M2 S5 is the
# milestone that needs it, because `renderToStaticHTML`'s third parameter
# defaults to **sanitizing** in muya and seventeen of the twenty transcribed
# `renderToStaticHTML.spec.ts` cases pass `true`. A `sanitize` parameter that
# quietly does nothing is worse than an unimplemented one, so this is not a
# dependency the milestone could defer to M5's paste path.
#
# **It is the largest tree in the workspace and that is recorded rather than
# discovered later**: `ammonia → url → idna → icu_normalizer / icu_properties`
# brings the ICU4X data crates with it, and `html5ever → markup5ever →
# web_atoms` brings `phf` and `string_cache`. Roughly fifty crates, against the
# fourteen the graph held before. §12.2 budgets "pulldown-cmark, serde, notify,
# pdf-writer, spellbook, misc" at ~1.5 MB and that line now understates the
# total; M2.md §6 says so beside the measurement rather than leaving §12.2 to
# be believed. Two of those subtrees are already scheduled anyway — §4's
# fourth row puts `html5ever` on M5's paste path, and §12.2 budgets ICU
# segmentation with `parley` at M3 — so the marginal cost at v1 is smaller
# than the marginal cost today.
#
# It satisfies §1's purity constraint for `mt-md`: no windowing, no GPU, no
# I/O. `cargo xtask deps` still reports 14 workspace crates.
#
# `serde` and `toml` are the seventh and eighth third-party crates and the
# sixth and seventh scheduled ones. `serde` is named in §12.2's size budget and
# in the "not until the milestone that needs it" spirit of the policy above;
# M3 S1 is the milestone, and M3.md §5 D4 is the decision that needs it — the
# theme model is "a typed `Theme` struct whose fields are all required,
# deserialized from TOML".
#
# **Why TOML rather than Rust literals**, given that M2's ratchets are consts
# for exactly the reason that they have a single consumer: this one does not.
# D4 puts an import path on M5 that reads a MarkText installation's 32
# stylesheets and emits themes, and its output has to be *writable*. **A const
# is not an export target.** The same argument rules out `include_str!`-ing
# CSS and parsing it at runtime, which D4 rejects separately: the CSS that
# would have to be parsed is not the flat variable block but the three themes
# that redefine pseudo-elements outright, and a parser faithful to that is a
# cascade engine — the thing M3 exists in order not to have.
#
# Feature sets are cut to what deserialization needs. `serde` keeps only `std`
# and `derive`. `toml` drops `display` (and with it the whole `toml_writer`
# subtree): S1 only ever reads a theme, and the writer belongs to whichever
# stage builds M5's exporter. What is left under `toml` is `toml_parser`,
# `winnow`, `toml_datetime`, `serde_spanned` and `serde_core` — all pure.
#
# Both satisfy §1's purity constraint for `mt-layout`: no I/O, no windowing,
# no GPU. The two shipped themes reach the binary through `include_str!`,
# which is a compile-time read, so `cargo xtask deps`' source scan for
# filesystem calls in the four headless crates stays clean.
[workspace.dependencies]
ammonia = "4"
fancy-regex = "0.19"
proptest = "1"
pulldown-cmark = { version = "0.13", default-features = false }
ropey = "1"
serde = { version = "1", default-features = false, features = ["std", "derive"] }
serde_json = "1"
toml = { version = "1", default-features = false, features = ["std", "parse", "serde"] }

mt-app = { path = "crates/mt-app", version = "0.1.0" }
mt-cli = { path = "crates/mt-cli", version = "0.1.0" }
mt-diagram = { path = "crates/mt-diagram", version = "0.1.0" }
mt-doc = { path = "crates/mt-doc", version = "0.1.0" }
mt-export = { path = "crates/mt-export", version = "0.1.0" }
mt-fs = { path = "crates/mt-fs", version = "0.1.0" }
mt-highlight = { path = "crates/mt-highlight", version = "0.1.0" }
mt-inline = { path = "crates/mt-inline", version = "0.1.0" }
mt-layout = { path = "crates/mt-layout", version = "0.1.0" }
mt-math = { path = "crates/mt-math", version = "0.1.0" }
mt-md = { path = "crates/mt-md", version = "0.1.0" }
mt-render = { path = "crates/mt-render", version = "0.1.0" }
mt-search = { path = "crates/mt-search", version = "0.1.0" }
mt-ui = { path = "crates/mt-ui", version = "0.1.0" }
